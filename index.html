<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editor de Ranking de Animes</title>
  <!-- Importação da fonte Roboto via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #1e1e24;
      --card-bg: #2b2d42;
      --accent-color: #e74c3c;
      --text-color: #edf2f4;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      font-weight: 900;
    }

    .container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 800px;
      width: 100%;
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      background-color: #111;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .control-card {
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .control-card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: #ffc600;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #1e1e24;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.9rem;
      font-family: 'Roboto', sans-serif;
    }

    input[type="range"] {
      width: 100%;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-family: 'Roboto', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary { background: #0077b6; color: white; }
    .btn-primary:hover { background: #0096c7; }

    .btn-success { background: #2a9d8f; color: white; }
    .btn-success:hover { background: #2ec4b6; }

    .btn-danger { background: var(--accent-color); color: white; }
    .btn-danger:hover { background: #c0392b; }

    .btn-preset {
      background: #e9c46a;
      color: #1e1e24;
      margin-bottom: 8px;
      font-size: 0.75rem;
      padding: 6px 10px;
    }
    .btn-preset:hover { background: #f4a261; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .modal p {
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h1>Editor de Ranking de Animes</h1>

  <div class="container">
    <div class="canvas-container">
      <canvas id="mainCanvas" width="726" height="190"></canvas>
    </div>

    <div class="control-card" style="margin-bottom: 15px;">
      <h3>Configuração Geral</h3>
      <div class="form-group" style="max-width: 200px;">
        <label for="yearInput">Ano (Faixa Vermelha - 4 dígitos):</label>
        <input type="text" id="yearInput" maxlength="4" placeholder="Ex: 0000" value="0000">
      </div>
    </div>

    <div class="controls-grid" id="slotsControls"></div>

    <div class="actions">
      <button class="btn-danger" id="btnReset">Resetar Tudo</button>
      <button class="btn-primary" id="btnPreview">Preview (Abrir em Nova Aba)</button>
      <button class="btn-success" id="btnSave">Salvar Imagem</button>
    </div>
  </div>

  <div class="modal-overlay" id="resetModal">
    <div class="modal">
      <h3>Confirmar Reset</h3>
      <p>Tem certeza de que deseja apagar todas as modificações? As alterações salvas serão perdidas.</p>
      <div class="modal-buttons">
        <button class="btn-danger" id="btnConfirmReset">Sim, Resetar</button>
        <button class="btn-primary" id="btnCancelReset">Cancelar</button>
      </div>
    </div>
  </div>

    const CANVAS_WIDTH = 726;
    const CANVAS_HEIGHT = 190;

    // Posições X centralizadas e distribuídas uniformemente (Canvas 726px)
    const SLOTS_CONFIG = [
      { circleX: 95,  circleY: 103, radius: 50, heartX: 68,  heartY: 172 },
      { circleX: 273, circleY: 103, radius: 50, heartX: 246, heartY: 172 },
      { circleX: 451, circleY: 103, radius: 50, heartX: 424, heartY: 172 },
      { circleX: 629, circleY: 103, radius: 50, heartX: 602, heartY: 172 }
    ];

    const defaultState = {
      year: '0000',
      slots: [
        { imageSrc: null, scale: 1, offsetX: 0, offsetY: 0, votes: '0000' },
        { imageSrc: null, scale: 1, offsetX: 0, offsetY: 0, votes: '0000' },
        { imageSrc: null, scale: 1, offsetX: 0, offsetY: 0, votes: '0000' },
        { imageSrc: null, scale: 1, offsetX: 0, offsetY: 0, votes: '0000' }
      ]
    };

    let state = JSON.parse(JSON.stringify(defaultState));
    const loadedImages = [null, null, null, null];

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const yearInput = document.getElementById('yearInput');

    document.fonts.ready.then(() => {
      loadStateFromLocalStorage();
      renderControlsUI();
      initEvents();
      drawCanvas();
    });

    function renderControlsUI() {
      const container = document.getElementById('slotsControls');
      container.innerHTML = '';

      state.slots.forEach((slot, index) => {
        const card = document.createElement('div');
        card.className = 'control-card';
        card.innerHTML = `
          <h3>Anime #${index + 1}</h3>
          <button class="btn-preset" data-index="${index}">Usar Imagem Padrão #${index + 1}</button>
          <div class="form-group">
            <label>Importar Imagem:</label>
            <input type="file" accept="image/*" class="img-input" data-index="${index}">
          </div>
          <div class="form-group">
            <label>Tamanho (Zoom):</label>
            <input type="range" class="scale-input" data-index="${index}" min="0.2" max="3" step="0.05" value="${slot.scale}">
          </div>
          <div class="form-group">
            <label>Mover Horizontal (X):</label>
            <input type="range" class="offset-x-input" data-index="${index}" min="-100" max="100" value="${slot.offsetX}">
          </div>
          <div class="form-group">
            <label>Mover Vertical (Y):</label>
            <input type="range" class="offset-y-input" data-index="${index}" min="-100" max="100" value="${slot.offsetY}">
          </div>
          <div class="form-group">
            <label>Votos (até 4 dígitos):</label>
            <input type="text" class="votes-input" data-index="${index}" maxlength="4" value="${slot.votes}">
          </div>
        `;
        container.appendChild(card);
      });
    }

    function initEvents() {
      yearInput.addEventListener('input', (e) => {
        state.year = e.target.value;
        saveStateToLocalStorage();
        drawCanvas();
      });

      document.getElementById('slotsControls').addEventListener('click', (e) => {
        if (e.target.classList.contains('btn-preset')) {
          const index = parseInt(e.target.dataset.index, 10);
          const presetSrc = PRESET_IMAGES[index];
          state.slots[index].imageSrc = presetSrc;
          loadImageForSlot(index, presetSrc, () => {
            saveStateToLocalStorage();
            drawCanvas();
          });
        }
      });

      document.getElementById('slotsControls').addEventListener('input', (e) => {
        const target = e.target;
        const index = parseInt(target.dataset.index, 10);
        if (isNaN(index)) return;

        if (target.classList.contains('scale-input')) {
          state.slots[index].scale = parseFloat(target.value);
        } else if (target.classList.contains('offset-x-input')) {
          state.slots[index].offsetX = parseInt(target.value, 10);
        } else if (target.classList.contains('offset-y-input')) {
          state.slots[index].offsetY = parseInt(target.value, 10);
        } else if (target.classList.contains('votes-input')) {
          state.slots[index].votes = target.value;
        }

        saveStateToLocalStorage();
        drawCanvas();
      });

      document.getElementById('slotsControls').addEventListener('change', (e) => {
        const target = e.target;
        if (target.classList.contains('img-input')) {
          const index = parseInt(target.dataset.index, 10);
          const file = target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
              const base64Img = evt.target.result;
              state.slots[index].imageSrc = base64Img;
              loadImageForSlot(index, base64Img, () => {
                saveStateToLocalStorage();
                drawCanvas();
              });
            };
            reader.readAsDataURL(file);
          }
        }
      });

      document.getElementById('btnSave').addEventListener('click', downloadCanvasImage);
      document.getElementById('btnPreview').addEventListener('click', openPreview);

      const modal = document.getElementById('resetModal');
      document.getElementById('btnReset').addEventListener('click', () => modal.style.display = 'flex');
      document.getElementById('btnCancelReset').addEventListener('click', () => modal.style.display = 'none');
      document.getElementById('btnConfirmReset').addEventListener('click', resetAll);
    }

    function loadImageForSlot(index, src, callback) {
      if (!src) {
        loadedImages[index] = null;
        if (callback) callback();
        return;
      }
      const img = new Image();
      img.onload = () => {
        loadedImages[index] = img;
        if (callback) callback();
      };
      img.src = src;
    }

    function drawCanvas() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;

      // 1. Fundo Amarelo Principal
      ctx.fillStyle = '#ffc600';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 2. Centralização do Bloco do Título + Faixa do Ano
      ctx.save();
      ctx.font = '900 22px "Roboto", sans-serif';
      
      const titleText = 'O MELHOR ANIME DA TEMPORADA';
      const textMetrics = ctx.measureText(titleText);
      const textWidth = textMetrics.width;

      const gap = 8;
      const rectWidth = 38;
      const rectHeight = 18;

      // Largura total ocupada pelo conjunto (Texto + Espaço + Caixa do Ano)
      const totalHeaderWidth = textWidth + gap + rectWidth;
      
      // Ponto inicial X para que todo o conjunto fique perfeitamente centralizado no canvas
      const startX = (CANVAS_WIDTH - totalHeaderWidth) / 2;
      const textY = 27;

      // Desenhar o Texto do Título
      ctx.shadowColor = '#f3b002';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(titleText, startX, textY);
      ctx.restore();

      // 3. Faixa Vermelha
      const rectX = startX + textWidth + gap;
      const rectY = textY - (rectHeight / 1.7);

      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(rectX, rectY, rectWidth, rectHeight);

      // Texto do Ano (Dígitos centralizados)
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 11px "Roboto", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(state.year || '0000', rectX + (rectWidth / 2), rectY + (rectHeight / 2) + 1);

      // 4. Renderizar os Slots (Centralizados)
      SLOTS_CONFIG.forEach((cfg, i) => {
        const slot = state.slots[i];

        // Anel Externo
        ctx.beginPath();
        ctx.arc(cfg.circleX, cfg.circleY, cfg.radius + 9, 0, Math.PI * 2);
        ctx.fillStyle = '#f3b002';
        ctx.fill();

        // Anel Intermediário
        ctx.beginPath();
        ctx.arc(cfg.circleX, cfg.circleY, cfg.radius + 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ffc600';
        ctx.fill();

        // Círculo Interno
        ctx.save();
        ctx.beginPath();
        ctx.arc(cfg.circleX, cfg.circleY, cfg.radius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        ctx.fillStyle = '#ffffff';
        ctx.fill();

        const img = loadedImages[i];
        if (img) {
          const aspect = img.width / img.height;
          let drawW = cfg.radius * 2 * slot.scale;
          let drawH = (cfg.radius * 2 / aspect) * slot.scale;

          let drawX = (cfg.circleX - drawW / 2) + slot.offsetX;
          let drawY = (cfg.circleY - drawH / 2) + slot.offsetY;

          ctx.drawImage(img, drawX, drawY, drawW, drawH);
        }
        ctx.restore();

        // Coração
        drawHeart(ctx, cfg.heartX, cfg.heartY - 2, 6);

        // Texto do Número de Votos
        ctx.save();
        ctx.shadowColor = '#f3b002';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 1.5;
        ctx.shadowOffsetY = 1.5;
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 15px "Roboto", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(slot.votes || '0000', cfg.heartX + 10, cfg.heartY + 2);
        ctx.restore();
      });
    }

    function drawHeart(ctx, x, y, size) {
      ctx.save();
      ctx.beginPath();
      ctx.fillStyle = '#e74c3c';
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x, y - size/2, x - size, y - size/2, x - size, y);
      ctx.bezierCurveTo(x - size, y + size/2, x, y + size, x, y + size * 1.2);
      ctx.bezierCurveTo(x, y + size, x + size, y + size/2, x + size, y);
      ctx.bezierCurveTo(x + size, y - size/2, x, y - size/2, x, y);
      ctx.fill();
      ctx.restore();
    }

    function saveStateToLocalStorage() {
      localStorage.setItem('anime_rank_state', JSON.stringify(state));
    }

    function loadStateFromLocalStorage() {
      const saved = localStorage.getItem('anime_rank_state');
      if (saved) {
        try {
          state = JSON.parse(saved);
          yearInput.value = state.year || '0000';
          
          let pendingLoads = state.slots.length;
          state.slots.forEach((slot, i) => {
            if (slot.imageSrc) {
              loadImageForSlot(i, slot.imageSrc, () => {
                pendingLoads--;
                if (pendingLoads === 0) drawCanvas();
              });
            } else {
              pendingLoads--;
            }
          });
        } catch (e) {
          console.error('Erro ao carregar dados salvos', e);
        }
      }
    }

    function downloadCanvasImage() {
      const link = document.createElement('a');
      link.download = `anime-rank-${state.year || 'editado'}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function openPreview() {
      const dataUrl = canvas.toDataURL('image/png');
      const win = window.open('');
      win.document.write(`<img src="${dataUrl}" style="max-width:100%; height:auto;"/>`);
    }

    function resetAll() {
      localStorage.removeItem('anime_rank_state');
      state = JSON.parse(JSON.stringify(defaultState));
      yearInput.value = state.year;
      loadedImages.fill(null);
      
      renderControlsUI();
      drawCanvas();
      document.getElementById('resetModal').style.display = 'none';
    }
  </script>
</body>
